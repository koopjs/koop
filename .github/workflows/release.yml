name: Test and release on pushed changeset to master

on:
  push:
    branches:
      - master
    paths:
      - ".changeset/*.md"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release-sha: ${{ steps.release-commit.outputs.sha }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
  
    - uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Install npm 7
      run: npm i -g npm@7 --registry=https://registry.npmjs.org
      
    - name: NPM install
      run: npm ci

    - name: Archive release dependencies
      run: |
        find node_modules packages -type d -name node_modules -prune -print0 |
          tar --null -czf "$RUNNER_TEMP/release-dependencies.tar.gz" --files-from -

    - name: Save release dependencies
      uses: actions/upload-artifact@v4
      with:
        name: release-dependencies
        path: ${{ runner.temp }}/release-dependencies.tar.gz
        retention-days: 90

    - name: Set Github identity
      run: |
        git config --global user.email "github-actions@ci.com"
        git config --global user.name "CI Agent"

    - name: Version
      run: npm run version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update coverage badges and report
      run: npm run cov:unit:json

    - name: Commit version and changelog updates
      run: "git add --all && git commit -m 'chore: version and changelog' --no-verify"

    - name: Record release commit
      id: release-commit
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Push versioning changes
      run: git push origin HEAD:master --no-verify

  release-npm:
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout release commit
      uses: actions/checkout@v3
      with:
        ref: ${{ needs.setup.outputs.release-sha }}
        fetch-depth: 0

    - uses: actions/setup-node@v3
      with:
        node-version: 18.x
        registry-url: https://registry.npmjs.org

    - name: Install npm 7
      run: npm i -g npm@7 --registry=https://registry.npmjs.org

    - name: Download release dependencies
      uses: actions/download-artifact@v4
      with:
        name: release-dependencies
        path: ${{ runner.temp }}

    - name: Restore release dependencies
      run: tar -xzf "$RUNNER_TEMP/release-dependencies.tar.gz"

    - name: Set Github identity
      run: |
        git config --global user.email "github-actions@ci.com"
        git config --global user.name "CI Agent"

    - name: Publish to NPM
      run: npm run release:npm -- --no-git-tag
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    # Recreate missing tags even when a previous attempt already published the packages.
    - name: Tag released versions
      run: npm exec changeset tag

    - name: Push release tags
      run: git push origin --tags --no-verify

  release-github:
    needs: [setup, release-npm]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout release commit
      uses: actions/checkout@v3
      with:
        ref: ${{ needs.setup.outputs.release-sha }}
        fetch-depth: 0

    - uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Install npm 7
      run: npm i -g npm@7 --registry=https://registry.npmjs.org

    - name: Download release dependencies
      uses: actions/download-artifact@v4
      with:
        name: release-dependencies
        path: ${{ runner.temp }}

    - name: Restore release dependencies
      run: tar -xzf "$RUNNER_TEMP/release-dependencies.tar.gz"

    - name: Github release
      run: npm run release:github
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: [release-npm, release-github]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout master
      uses: actions/checkout@v3
      with:
        ref: master

    - uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Install npm 7
      run: npm i -g npm@7 --registry=https://registry.npmjs.org

    - name: Set Github identity
      run: |
        git config --global user.email "github-actions@ci.com"
        git config --global user.name "CI Agent"

    - name: Update root package-lock.json
      run: npm install --package-lock-only --ignore-scripts

    - name: Commit package-lock update
      run: |
        git add package-lock.json
        if ! git diff --cached --quiet; then
          git commit -m 'chore: update package-lock post-npm release' --no-verify
        fi

    - name: Push package-lock changes
      run: git push origin HEAD:master --no-verify